[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "karlab-parasut-client"
version = "0.1.3"
description = "Paylaşılan Paraşüt purchase_bills client — HTTP, normalizasyon, retry/backoff (domain mantığı YOK)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[tool.setuptools.packages.find]
include = ["karlab_parasut_client*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
